<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebOS</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="calculator.css">
</head>

<body>

  <!-- Taskbar -->
  <div class="topbar">

    <p id="welcomeopen" class="topbar-button">
      WebOS
    </p>

    <p class="topbar-message">
      Always on the web?
    </p>

    <p id="timeElement" class="topbar-button">
      Loading...
    </p>

  </div>

  <!-- Welcome Window -->
  <div class="window" id="welcome">

    <div class="windowheader" id="welcomeheader">

      <div class="closebutton" id="welcomeclose"></div>

      <p class="headertext">Welcome</p>

      <div style="width:16px;"></div>

    </div>

    <div class="windowcontent">

      <h2>WebOS</h2>

      <p>
        Hello guys! I'm learning coding.
        I love computers so I thought this
        would be a good way to start since
        I have no experience with code.
      </p>

    </div>

  </div>
<div id="desktopApps">
  <div id="notesicon" class="appicon">
    <img src="notes.png" class="iconimage">
    <p>Notes</p>
  </div>
  <div id="calculatoricon" class="appicon">
    <img src="calculator.png" class="iconimage">
    <p>Calculator</p>
  </div>
</div>

<div class="window" id="notes" style="display:none;">
  <div class="windowheader" id="notesheader">
    <div class="closebutton" id="notesclose"></div>
    <p class="headertext">Notes</p>
    <div style="width:16px;"></div>
  </div>

  <div class="windowcontent">
  <h2>Notes</h2>

  <textarea rows="10" cols="30"></textarea>
</div>
</div>

<div class="window" id="calculator" style="display:none;">
  <div class="windowheader" id="calculatorheader">
    <div class="closebutton" id="calculatorclose"></div>
    <p class="headertext">Calculator</p>
    <div style="width:16px;"></div>
  </div>

  <div class="windowcontent">
    <div class="container">
      <div class="calc-text">
        <p id="user-input">0</p>
      </div>

      <div class="calc-keys">
        <button type="button" class="key-others operations">AC</button>
        <button type="button" class="key-others operations">DEL</button>
        <button type="button" class="key-others operations">%</button>
        <button type="button" class="key-operate operations">/</button>

        <button type="button" class="numbers">7</button>
        <button type="button" class="numbers">8</button>
        <button type="button" class="numbers">9</button>
        <button type="button" class="key-operate operations">*</button>

        <button type="button" class="numbers">4</button>
        <button type="button" class="numbers">5</button>
        <button type="button" class="numbers">6</button>
        <button type="button" class="key-operate operations">-</button>

        <button type="button" class="numbers">1</button>
        <button type="button" class="numbers">2</button>
        <button type="button" class="numbers">3</button>
        <button type="button" class="key-operate operations">+</button>

        <button type="button" class="key-zero numbers">0</button>
        <button type="button" class="numbers">.</button>
        <button type="button" class="key-operate operations">=</button>
      </div>
    </div>
  </div>
</div>


<script type="text/javascript" src="script.js"></script>
<script type="text/javascript" src="calculator.js"></script>
</body>
</html>
